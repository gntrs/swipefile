<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipefile capture options</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0A0A0A; color: #F4F4F5; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; line-height: 1.15; letter-spacing: -0.01em; margin: 0 0 8px; }
  p { color: #8B8B8B; margin: 0 0 24px; }
  label { display: block; font: 500 12px/1.4 ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: 0.12em; color: #8B8B8B; margin-bottom: 8px; }
  input { box-sizing: border-box; width: 100%; min-height: 44px; padding: 10px 14px; background: #161616; color: #F4F4F5; border: 1px solid #262626; border-radius: 8px; font: inherit; }
  input:focus { outline: none; border-color: #FFFFFF; }
  button { min-height: 44px; min-width: 44px; margin-top: 12px; padding: 0 20px; background: #FFFFFF; color: #0A0A0A; border: 0; border-radius: 8px; font: 600 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
  #status { min-height: 24px; margin-top: 12px; color: #F4F4F5; }
</style>
</head>
<body>
<main>
  <h1>Swipefile capture</h1>
  <p>The address of your own swipefile. Saved ads open there, and nowhere else.</p>
  <form id="form">
    <label for="appUrl">Your swipefile address</label>
    <input id="appUrl" name="appUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://swipefile.example.com">
    <button type="submit">Save</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
</main>
<script src="options.js"></script>
</body>
</html>
